<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Difu'sBisProRoute: ruta pre-raid para Warrior (Prot y Fury) y Warlock (Aflicción, Demonología y Destrucción) en WoW Forever, con optimizador de caps, enlace a WoWSims y addon gratuito.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Difu'sBisProRoute</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky command bar (faction, language, caps, sim) + tabbed workspace: Route (dependency-ordered steps) / Gear (up to 5 options per slot); WoW-style item tooltips on hover/tap */
:root{
  --bg:#141110; --panel:#1c1714; --panel2:#241d19; --line:#3b2f27; --fg:#efe6d6; --muted:#a69684;
  --gold:#c69b6d; --gold-ink:#1a120b; --blood:#b02a20; --blood-ink:#fff1e8; --steel:#8c97a3;
  --epic:#b98af5; --rare:#5aa2ff; --unc:#4fd07a;
  --good:#6cc07a; --warn:#e0a14a; --bad:#e5604f;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2ebe0; --panel:#fffaf2; --panel2:#f7efe3; --line:#ddcdb6; --fg:#2a1e16; --muted:#6e5c4b;
  --gold:#8a5a2e; --gold-ink:#fffaf2; --blood:#9b1c16; --blood-ink:#ffffff; --steel:#56616c;
  --epic:#7a3fc6; --rare:#1d5fc8; --unc:#1c8a43;
  --good:#2c7a3f; --warn:#9a5d10; --bad:#b0302a; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2ebe0; --panel:#fffaf2; --panel2:#f7efe3; --line:#ddcdb6; --fg:#2a1e16; --muted:#6e5c4b;
  --gold:#8a5a2e; --gold-ink:#fffaf2; --blood:#9b1c16; --blood-ink:#ffffff; --steel:#56616c;
  --epic:#7a3fc6; --rare:#1d5fc8; --unc:#1c8a43;
  --good:#2c7a3f; --warn:#9a5d10; --bad:#b0302a; color-scheme:light}
/* the tooltip keeps the in-game look in both themes: dark navy box, quality colors tuned for it */
:root{--tt-bg:#070b1c;--tt-line:#5c6a8a;--tt-fg:#ffffff;--tt-equip:#1eff00;--tt-muted:#c9c9c9;--tt-gold:#ffd100;--tt-epic:#a335ee;--tt-rare:#0070dd;--tt-unc:#1eff00}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--rare)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--panel),var(--panel2));border-bottom:2px solid var(--blood)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding-block:12px}
h1{font:800 22px/1.1 var(--f-display);letter-spacing:.03em;margin:0;text-wrap:balance;color:var(--gold)}
h1 small{color:var(--muted)}
h1 small{display:block;font:500 12px/1.3 var(--f-body);color:var(--muted);letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:600}
.meters{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.meter{min-width:120px}
.meter .lbl{display:flex;justify-content:space-between;gap:8px;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter .lbl b{color:var(--fg);font-weight:500}
.track{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--blood),color-mix(in srgb,var(--blood) 60%,var(--gold)));transition:width .3s}
.track i.ok{background:var(--good)}
.track i.soft{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 70%,#000),var(--gold))}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--panel2);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;color:var(--fg);font-size:13px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 92%,#fff),color-mix(in srgb,var(--gold) 80%,#000));color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 60%,#000);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 rgba(0,0,0,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--gold)}
main.wrap{padding-block:18px 60px;display:grid;gap:18px;position:relative;z-index:1}
.bgwar{position:fixed;right:-40px;bottom:0;height:min(90vh,780px);aspect-ratio:2/3;max-width:70vw;color:var(--gold);opacity:.10;pointer-events:none;z-index:0}
.bgwar svg{width:100%;height:100%;display:block}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .bgwar{opacity:.13}}
:root[data-theme="light"] .bgwar{opacity:.13}
/* Warlock: fel purple accent instead of the warrior red, and its own watermark */
:root[data-cls="warlock"]{--blood:#8b4fd8;--blood-ink:#fbf6ff}
@media (prefers-color-scheme: light){:root[data-cls="warlock"]:not([data-theme="dark"]){--blood:#6a2fb0}}
:root[data-cls="warlock"][data-theme="light"]{--blood:#6a2fb0}
.bgwl{display:none}
:root[data-cls="warlock"] .bgwar{display:none}
:root[data-cls="warlock"] .bgwl{display:block;color:var(--blood)}
@media (max-width:640px){.bgwar{opacity:.06;right:-80px}}
.next{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-left:4px solid var(--blood);border-radius:10px;padding:14px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--blood) 14%,var(--panel)),var(--panel) 75%)}
.next .eyebrow{font:500 11px var(--f-mono);color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.next h2{margin:2px 0 2px;font:700 19px/1.25 var(--f-display);text-wrap:balance}
.next p{margin:0;color:var(--muted);min-width:0}
.next .acts{display:flex;gap:8px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:12px;font:500 12px var(--f-mono);color:var(--muted)}
.prog .track{flex:1;height:8px;margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabs button{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer;color:var(--muted);font:700 15px var(--f-display);letter-spacing:.04em;transition:border-color .15s,color .15s,background .15s}
.tabs button:hover{color:var(--fg);border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.tabs button[aria-selected="true"]{color:var(--gold);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel));box-shadow:0 0 0 1px var(--gold) inset}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tabs .tab-ic{font-size:17px;line-height:1}
.tabs #tab-data{font:500 13px var(--f-body);padding:10px 14px;margin-left:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.toolbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.phase{display:grid;gap:8px}
.phase h3{margin:10px 0 2px;color:var(--gold);font:700 15px var(--f-display);letter-spacing:.04em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.phase h3 span{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px}
.step.done{opacity:.6;border-left-color:var(--good)}
.step.skipped{opacity:.5;border-style:dashed}
.step.isnext{border-left-color:var(--blood)}
.step.blocked .t{color:var(--muted)}
.chk{width:20px;height:20px;margin-top:2px;accent-color:var(--good);cursor:pointer}
.step .t{font-weight:600;min-width:0}
.step.done .t{text-decoration:line-through}
.step .where{font:500 12px var(--f-mono);color:var(--muted)}
.step .d{grid-column:2/4;color:var(--muted);font-size:13px;min-width:0}
.step .meta{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 11px var(--f-mono);padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.req{border-color:var(--warn);color:var(--warn);white-space:normal}
.chip.note{border-color:var(--bad);color:var(--bad)}
.laterBox{margin-top:18px}
.laterBox details{border:1px dashed color-mix(in srgb,var(--gold) 55%,var(--line));border-radius:10px;padding:10px 14px;background:color-mix(in srgb,var(--gold) 6%,var(--panel))}
.laterBox summary{cursor:pointer;display:flex;gap:10px;align-items:center;font:700 15px var(--f-display);color:var(--gold);letter-spacing:.04em}
.laterBox .cnt{font:600 11px var(--f-mono);background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:1px 8px}
.laterBox .lh{color:var(--muted);font-size:13px;margin:6px 0 10px}
.step.later{border-left-color:var(--gold);border-style:dashed}
.sacts{display:flex;gap:2px;align-items:start}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;text-decoration:underline}
/* item references: dotted underline marks "hover/tap for tooltip" */
.it{cursor:help;font-weight:600;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:1px}
.chip .it{font-weight:500}
.q4{color:var(--epic)} .q3{color:var(--rare)} .q2{color:var(--unc)}
.doll{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px) minmax(0,1fr);gap:14px;align-items:start}
.doll .col{display:grid;gap:12px;min-width:0}
.statsCol{align-self:stretch;min-width:0}
.stats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);display:grid;gap:10px;border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--blood) 10%,var(--panel)),var(--panel) 40%)}
.stats h3{margin:0;font:800 16px var(--f-display);letter-spacing:.06em;color:var(--gold);text-align:center}
.stats .model{font-size:11px;color:var(--muted);text-align:center;margin:-4px 0 0}
.cap{display:grid;gap:3px}
.cap .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.cap .row b{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.cap .note{font-size:11px;color:var(--muted)}
.cap .track{height:8px;margin:0;position:relative;overflow:visible}
.cap .track i{border-radius:3px}
.cap .track i.ok{background:var(--good)}
.cap .track i.soft{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 70%,#000),var(--gold))}
.cap .track .ghost{position:absolute;top:0;height:100%;border-radius:3px;background:color-mix(in srgb,var(--gold) 45%,transparent)}
.av{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.av span:nth-child(3n+2){border-bottom:1px dotted var(--line);align-self:center}
.tal{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:4px}
.tal .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;align-items:baseline}
.tal .row b{white-space:nowrap}
.tal .row b{font:700 13px var(--f-display);color:var(--gold);letter-spacing:.04em}
.tal .row span{font-size:11px;color:var(--muted)}
.tal label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.tal small{display:block;font:11px var(--f-mono);color:var(--muted)}
.tal select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font:13px var(--f-mono)}
.av b{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.dl{font:500 11px var(--f-mono);margin-left:4px}
.dl.up{color:var(--good)} .dl.dn{color:var(--bad)}
.opt .delta{grid-column:3/5;display:flex;gap:4px;flex-wrap:wrap}
.opt .delta span{font:500 10.5px var(--f-mono);padding:0 5px;border-radius:4px;background:var(--panel)}
.opt .delta .up{color:var(--good)} .opt .delta .dn{color:var(--bad)} .opt .delta .cur{color:var(--muted)}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start}
.slot.off{opacity:.55}
.slot header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slot h4{margin:0;font:700 13px var(--f-display);letter-spacing:.06em;color:var(--gold)}
.slot .ench{font:500 11px var(--f-mono);color:var(--muted);text-align:right}
.opt{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.opt:has(input:checked){border-color:var(--gold)}
.opt input{margin-top:3px;accent-color:var(--gold);cursor:pointer}
.opt .nm{min-width:0}
.opt .bigico{grid-column:2;grid-row:1/span 3;cursor:pointer;align-self:start}
.opt .nm .ico.mini{display:none}
.ico{position:relative;display:inline-grid;place-items:center;flex:none;overflow:hidden;border-radius:4px;border:1px solid currentColor;background:#0d0b0a;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.ico b{font:700 11px var(--f-display);color:currentColor;opacity:.8}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ico.mini{width:18px;height:18px;margin:-2px 5px 0 0;border-radius:3px}
.ico.mini b{font-size:9px}
.ico.big{width:42px;height:42px;border-width:2px;border-radius:6px}
.ico.big b{font-size:17px}
.ico.tt{width:40px;height:40px;border-width:2px;border-radius:5px}
.ico.q4{color:var(--epic)} .ico.q3{color:var(--rare)} .ico.q2{color:var(--unc)}
#tt .ico.q4{color:var(--tt-epic)} #tt .ico.q3{color:var(--tt-rare)} #tt .ico.q2{color:var(--tt-unc)}
#tt .tth{display:flex;gap:9px;align-items:center;margin-bottom:2px}
#tt .tth .n{margin:0}
.opt .wh{font:500 11px var(--f-mono);color:var(--muted);text-decoration:none;align-self:start}
.opt .wh:hover{color:var(--gold)}
.opt .st{grid-column:3/5;font:400 11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.opt .src{grid-column:3/5;font-size:12px;color:var(--muted)}
.opt .badges{grid-column:3/5;display:flex;gap:4px;flex-wrap:wrap}
.opt .own{grid-column:3/5;display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer;width:max-content}
.opt .own input{accent-color:var(--good);margin:0}
.opt.owned{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--panel2))}
.opt.owned .own{color:var(--good);font-weight:600}
.slot .has{font:500 11px var(--f-mono);color:var(--good)}
.b{font:600 10px var(--f-mono);padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.b.wfb{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.b.wtbc{background:color-mix(in srgb,var(--rare) 20%,transparent);color:var(--rare)}
.b.warn{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.slot footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.tabk{border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 12%,var(--panel2));color:var(--gold);border-radius:999px;padding:3px 12px;font:600 12px var(--f-body);cursor:pointer}
.tabk[aria-expanded="true"]{background:var(--gold);color:var(--gold-ink)}
.opt.solo{grid-template-columns:0 1fr auto;column-gap:0}
.opt.solo input[type=radio]{visibility:hidden;width:0;margin:0}
.opt.solo .wh{margin-left:8px}
[hidden]{display:none!important}
.presetBar{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.presel{background:var(--panel2);color:var(--fg);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;max-width:100%;min-width:0;cursor:pointer}
.presel:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.spsel{font-weight:600;padding:6px 8px;min-width:9.5em}
.tsrc{font-weight:600;font-size:10.5px;letter-spacing:.02em;padding:0 5px;border-radius:4px;border:1px solid var(--line)}
.tsrc.addon{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.tsrc.assumed{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.pchip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.pchip button{background:none;border:0;padding:7px 10px;cursor:pointer;color:var(--fg);font-size:13px}
.pchip button+button{border-left:1px solid var(--line);color:var(--muted);padding:7px 8px}
.pchip button:hover{color:var(--gold)}
.pform{display:inline-flex;gap:6px;align-items:center}
.pform input{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:13px var(--f-body);width:160px}
.slot footer label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.crypto{display:grid;gap:6px;flex-basis:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);min-width:0}
.crypto code{font-size:12.5px;overflow-wrap:anywhere;user-select:all;color:var(--fg)}
.crypto .btn{justify-self:start}
.crypto small{color:var(--muted)}
/* ---- gear slots, character-sheet style ---- */
.col{display:grid;gap:6px;align-content:start;min-width:0}
.gs{border-radius:10px;border:1px solid transparent;min-width:0}
.gs.open{border-color:var(--line);background:var(--panel)}
.gs.off .gs-row{opacity:.45}
.gs-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:8px 8px;border-radius:10px}
.gs-row:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.gs.r .gs-row{grid-template-columns:auto minmax(0,1fr) auto;direction:rtl}
.gs.r .gs-row>*{direction:ltr}
.gs.r .gs-b{text-align:right}
.gs.r .gs-badges{justify-content:flex-end}
.gs-ic{position:relative;cursor:help;line-height:0}
.gs-ic .ico.big,.gopt-ic .ico.big{width:48px;height:48px;border-width:2px;border-radius:6px;box-shadow:0 0 10px -2px currentColor,inset 0 0 0 1px rgba(0,0,0,.6)}
.gs-own{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;font:700 11px/18px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.gs-b{min-width:0;display:grid;gap:1px}
.gs-slot{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gs-off{color:var(--bad)}
.gs-n{font:700 15px/1.25 var(--f-body);cursor:help;overflow-wrap:anywhere}
.gs-set{justify-self:start;font:500 11px var(--f-body);color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:0 6px;margin:2px 0}
.gs.r .gs-set{justify-self:end}
.gs-en{font-size:12.5px;color:var(--unc);display:flex;align-items:center;gap:0}
.gs.r .gs-en{justify-content:flex-end}
.gs-src{font-size:12px;color:var(--muted)}
.gs-badges{display:flex;gap:4px;flex-wrap:wrap}

.gs-opts{display:grid;gap:6px;padding:0 8px 10px}
.gopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}
.gopt.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.gopt.owned{border-color:var(--good)}

.gopt-b{min-width:0;display:grid;gap:2px}
.gopt-n{font:700 14px var(--f-body);cursor:pointer}
.gopt-st{font:400 11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.gopt-src{font-size:12px;color:var(--muted)}
.gopt-meta{display:flex;flex-wrap:wrap;gap:4px}
.gopt-meta .badges,.gopt-meta .delta{display:flex;gap:4px;flex-wrap:wrap}
.gopt-meta .delta span{font:500 10.5px var(--f-mono);padding:0 5px;border-radius:4px;background:var(--panel)}
.gopt-meta .delta .up{color:var(--good)} .gopt-meta .delta .dn{color:var(--bad)} .gopt-meta .delta .cur{color:var(--muted)}

.gopt-act .own{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
.gopt-act .own input{accent-color:var(--good);margin:0}
.gopt-act .wh{font:500 11px var(--f-mono);color:var(--muted);text-decoration:none}
.gopt-act .wh:hover{color:var(--gold)}
.gs-ignore{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);justify-self:end}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.gopt:has(.sr:focus-visible){outline:2px solid var(--gold);outline-offset:1px}

.site-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}

textarea{width:100%;min-height:90px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:12px var(--f-mono);padding:8px}

#tt{position:fixed;z-index:30;max-width:300px;width:max-content;pointer-events:none;background:var(--tt-bg);color:var(--tt-fg);border:1px solid var(--tt-line);border-radius:5px;padding:9px 11px;font:13px/1.4 var(--f-body);box-shadow:0 6px 24px rgba(0,0,0,.45)}
#tt .n{font-size:15px;font-weight:600;margin-bottom:2px}

.next h2{font-size:22px}

.phase{gap:0;position:relative;padding-left:22px;margin-top:6px}
.phase::before{content:"";position:absolute;left:7px;top:40px;bottom:8px;width:2px;background:color-mix(in srgb,var(--gold) 35%,var(--line))}
.phase h3{margin:14px 0 6px -22px;font-size:17px;padding-left:22px;position:relative}
.phase h3::before{content:"";position:absolute;left:2px;top:50%;width:12px;height:12px;margin-top:-6px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.step{background:none;border:0;border-radius:6px;border-left:0;padding:10px 12px;position:relative}
.step::before{content:"";position:absolute;left:-19px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 55%,var(--line))}
.step + .step{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-top-left-radius:0;border-top-right-radius:0}
.step.done::before{background:var(--good);box-shadow:0 0 0 2px var(--good)}
.step.isnext{background:color-mix(in srgb,var(--blood) 9%,transparent)}
.step.isnext::before{background:var(--blood);box-shadow:0 0 0 2px var(--blood),0 0 0 6px color-mix(in srgb,var(--blood) 25%,transparent)}
.step.skipped{border-style:solid}

.chip{border-radius:4px}
/* stats sheet stays the one framed panel on the gear tab */
.stats{border-radius:4px;box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%,var(--line)),0 10px 30px -20px rgba(0,0,0,.7)}
.panel{border-radius:4px}
.gs-row{border-radius:4px}

  how:`<h3>Cómo se arma la ruta</h3><p>Cada ítem que eliges en <b>Equipo</b> está atado a los pasos que lo desbloquean (llaves, quests, mazmorras, profesiones). La ruta junta esos pasos, les suma sus prerrequisitos y los ordena para que nunca hagas un paso antes de lo que lo abre. Si cambias un ítem, la ruta se recalcula.</p><ul><li><b>Completar</b> marca el paso como hecho y cuenta para tu progreso.</li><li><b>Omitir</b> lo saca de tu ruta y del total (por ejemplo, si un compañero tiene la llave de UBRS). Se restaura con "Mostrar omitidos".</li><li><b>Ya lo tengo</b> va en cada una de las 3 opciones. Si marcas la opción elegida del slot, la ruta saca los pasos que solo servían para ese ítem. Si marcas otra, queda registrada como lo que llevas puesto y la ruta sigue apuntando a la opción elegida (tu mejora).</li><li><b>Para después</b> deja el paso en tu ruta sin completarlo ni omitirlo; aparece al final de la Ruta y lo retomas cuando quieras.</li><li><b>Cambiar</b> en cada slot despliega sus 3 opciones; al elegir una se vuelve a cerrar.</li><li><b>+ Guardar preset</b> guarda tu selección actual con un nombre para volver a aplicarla.</li><li><b>Ignorar slot</b> excluye el slot de la ruta y del sim.</li></ul>`,
  src:`<h3>Fuentes</h3><ul><li><a href="https://wowforeverbislist.com/preraid/warrior/protection/" target="_blank" rel="noopener">WoW Forever BiS List</a>: lista por EP con caps de 440 Defense, 8% hit y 6.5% expertise (datos del 21 nov 2026). Badge <span class="b wfb">WFB</span>.</li><li><a href="https://wowtbc.gg/warcraftforever/bis-list/protection-warrior/" target="_blank" rel="noopener">wowtbc.gg</a>: lista pre-raid de la comunidad. Badge <span class="b wtbc">WTBC</span>.</li><li><a href="https://www.wowsims.com/forever/warrior/protection/" target="_blank" rel="noopener">WoWSims Forever</a>: el botón arma el mismo tipo de link que usa WoW Forever BiS List (equipo y enchants; talentos y consumibles quedan como los tengas en WoWSims).</li><li>Tooltips: armados con los stats que publican esas listas. Cada ítem enlaza a Wowhead Forever para el tooltip oficial.</li><li>Presets de resistencias (Naturaleza / Fuego): calculados sobre la base de datos de ítems de WoWSims Forever, sin drops de raid ni PvP.</li><li>Cadena T0.5 y Tarnished Undermine Real: guías de LepreStore y ConquestCapped. Los ítems con <span class="b warn">VERIFICAR</span> tienen fuente incierta.</li></ul>`},

  how:`<h3>How the route is built</h3><p>Each item you pick in <b>Gear</b> is tied to the steps that unlock it (keys, quests, dungeons, professions). The route collects those steps, adds their prerequisites and orders them so you never do a step before whatever opens it. Change an item and the route recalculates.</p><ul><li><b>Complete</b> marks the step as done and counts toward progress.</li><li><b>Skip</b> removes it from your route and from the total (for example, a groupmate has the UBRS key). Restore it with "Show skipped".</li><li><b>I have it</b> sits on each of the 3 options. Mark the slot's selected option and the route drops the steps that were only needed for it. Mark another one and it is recorded as what you wear; the route keeps targeting the selected option (your upgrade).</li><li><b>Later</b> keeps the step on your route without completing or skipping it; it appears at the end of the Route and you resume it when you want.</li><li><b>Change</b> on each slot opens its 3 options; picking one closes it again.</li><li><b>+ Save preset</b> stores your current selection under a name so you can apply it again.</li><li><b>Ignore slot</b> drops the slot from the route and the sim.</li></ul>`,
  src:`<h3>Sources</h3><ul><li><a href="https://wowforeverbislist.com/preraid/warrior/protection/" target="_blank" rel="noopener">WoW Forever BiS List</a>: EP-based list with 440 Defense, 8% hit and 6.5% expertise caps (data from Nov 21, 2026). Badge <span class="b wfb">WFB</span>.</li><li><a href="https://wowtbc.gg/warcraftforever/bis-list/protection-warrior/" target="_blank" rel="noopener">wowtbc.gg</a>: community pre-raid list. Badge <span class="b wtbc">WTBC</span>.</li><li><a href="https://www.wowsims.com/forever/warrior/protection/" target="_blank" rel="noopener">WoWSims Forever</a>: the button builds the same link format WoW Forever BiS List uses (gear and enchants; talents and consumables stay as you have them in WoWSims).</li><li>Tooltips: built from the stats those lists publish. Every item links to Wowhead Forever for the official tooltip.</li><li>Resistance presets (Nature / Fire): computed from the WoWSims Forever item database, no raid drops or PvP.</li><li>T0.5 chain and Tarnished Undermine Real: LepreStore and ConquestCapped guides. Items marked <span class="b warn">VERIFY</span> have an uncertain source.</li></ul>`}
};

function computeRoute(){
  const need=new Map(); // node -> Set(item ids)
  SLOTS.forEach(sl=>{
    if(slotOff(sl.k)) return;
    const o=selected(sl); if(S.have[o.id]) return;
    const walk=id=>{ const n=NODE[id]; if(!n) return; if(!need.has(id)) need.set(id,new Set()); need.get(id).add(o.id); n.deps.forEach(walk); };
    o.req.forEach(walk);
  });
  const ids=[...need.keys()], done=new Set(), order=[];
  const key=id=>PH_RANK[NODE[id].phase]*1000+NODE[id].i;
  while(order.length<ids.length){
    const ready=ids.filter(id=>!done.has(id)&&NODE[id].deps.every(d=>!need.has(d)||done.has(d))).sort((a,b)=>key(a)-key(b));
    if(!ready.length) break;
    done.add(ready[0]); order.push(ready[0]);
  }
  return {order, need};
}

// Best hit while keeping the 440 defense cap: DP over slots on item defense (capped at what is needed).
// mode 'ep' = WFB stat weights (default) · 'tank' = the original version: only Stamina + armor
// noCraft: only items you loot / get from quests, vendors or reputation (no crafting, no Auction House)
const CRAFT_REQ=['craft','bs','plans','eng','ah','lw','prof_bs'];
const isCraftOrAH=o=>o.bind==='boe'||(o.req||[]).some(r=>CRAFT_REQ.includes(r));
function optimizeHit(useUnverified,mode,noCraft){
  if(IS_FURY()){ // try with and without forcing each 2-piece set bonus (Devilsaur = +2% hit)
    let best=runOpt(useUnverified,mode,noCraft,null);
    for(const name in SET_BONUS){ const forced={};
      SLOTS.forEach(sl=>{ const o=optsFor(sl).find(o=>!o.xo&&o.set===name&&!(noCraft&&isCraftOrAH(o))&&(useUnverified||!o.verify)); if(o&&!S.offSlot[sl.k]) forced[sl.k]=o; });
      if(Object.keys(forced).length<SET_BONUS[name].need) continue;
      const r=runOpt(useUnverified,mode,noCraft,{forced,st:SET_BONUS[name].st});
      if(r&&(r.h>best.h||(r.h===best.h&&r.score>best.score))) best=r; }
    return best; }
  return runOpt(useUnverified,mode,noCraft,null);

function runOpt(useUnverified,mode,noCraft,variant){
  const fury=IS_FURY();
  const T=Object.assign({a:5,d:5,s:5,t:0},S.talents||{});
  const enchDef=S.ench?SLOTS.reduce((a,sl)=>a+(!S.offSlot[sl.k]&&sl.ench&&sl.ench.st.def||0),0):0;
  const need=fury?0:Math.max(0,MODEL.defCap-300-T.a*4-enchDef), HC=Math.round((fury?FMODEL.hitCap:MODEL.hitCap)*10);
  // state: defense (capped at need) x hit in tenths (capped at the cap) -> best score (EP or survivability)
  const h0=variant&&variant.st.hit||0;
  let dp=new Map([['0|'+Math.min(HC,Math.round(h0*10)),{d:0,h:Math.min(HC,Math.round(h0*10)),score:h0*(fury?EPW_F.hit:0),hit:h0,pick:{}}]]);
  SLOTS.forEach(sl=>{ if(S.offSlot[sl.k]) return;
    let opts=optsFor(sl).filter(o=>!o.xo); const f=opts.filter(o=>useUnverified||!o.verify); if(f.length) opts=f;
    if(noCraft){ opts=opts.filter(o=>!isCraftOrAH(o)); if(!opts.length) return; }
    if(variant&&variant.forced[sl.k]) opts=[variant.forced[sl.k]];
    const nx=new Map();
    for(const v of dp.values()) for(const o of opts){
      if((sl.k==='finger2'&&v.pick.finger1===o.id)||(sl.k==='trinket2'&&v.pick.trinket1===o.id)) continue; // unique
      const nd=Math.min(need,v.d+(o.st.def||0)), hit=v.hit+(o.st.hit||0), nh=Math.min(HC,Math.round(hit*10));
      const score=v.score+(fury?epFury(o,sl.k):mode==='tank'?(o.st.sta||0)+(o.st.armor||0)/20:epOf(o,sl.k)), key=nd+'|'+nh, cur=nx.get(key);
      if(!cur||score>cur.score) nx.set(key,{d:nd,h:nh,score,hit,pick:Object.assign({},v.pick,{[sl.k]:o.id})}); }
    dp=nx; });
  let best=null;
  for(const v of dp.values()){ if(v.d<need) continue; if(!best||v.h>best.h||(v.h===best.h&&v.score>best.score)) best=v; }
  if(!best) best=[...dp.values()].sort((x,y)=>y.d-x.d||y.h-x.h)[0];
  return best;
}

// ---------- WOWSIMS LINK (same proto format WoW Forever BiS List uses) ----------
const WS_ORDER=['head','neck','shoulder','back','chest','wrist','hands','waist','legs','feet','finger1','finger2','trinket1','trinket2','mainhand','offhand','ranged'];
function pbVar(o,n){while(n>127){o.push((n&127)|128);n=Math.floor(n/128)}o.push(n)}
function pbInt(o,f,n){if(n){pbVar(o,f*8);pbVar(o,n)}}
function pbMsg(o,f,b){pbVar(o,f*8+2);pbVar(o,b.length);for(const x of b)o.push(x)}
async function simURL(){
  const base=IS_WL()?'https://www.wowsims.com/forever/warlock/dps/':IS_FURY()?'https://www.wowsims.com/forever/warrior/dps/':'https://www.wowsims.com/forever/warrior/protection/';
  if(typeof CompressionStream==='undefined') return base;
  const eq=[];
  WS_ORDER.forEach(k=>{ const sl=SLOTS.find(s=>s.k===k), it=[];
    if(sl && !slotOff(k)){ const o=selected(sl); pbInt(it,1,o.id); if(S.ench&&sl.ench&&!(IS_WL()&&k==='mainhand'&&!o.two)) pbInt(it,3,sl.ench.ws); }
    pbMsg(eq,1,it); });
  const pl=[]; pbInt(pl,54,2); pbMsg(pl,3,eq);
  const set=[]; pbInt(set,15,2); pbMsg(set,3,pl);
  try{
    const stream=new Blob([new Uint8Array(set)]).stream().pipeThrough(new CompressionStream('deflate'));
    const b=new Uint8Array(await new Response(stream).arrayBuffer()); let s=''; b.forEach(c=>s+=String.fromCharCode(c));
    return base+'?i=g#'+btoa(s);

      ${line(U('armorL'),'armor',n0)}<span>${U('armorL')} (${U('drL')})</span><span></span><b>${f1(v.dr)}%${p?dl(a.dr,v.dr,f1):''}</b>
      ${line(U('hpL'),'hp',n0)}${line(U('staL'),'sta',n0)}${line(U('bvL'),'bv',n0)}

    </div>
    <div class="av">
      ${line(U('strL'),'str',n0)}${line(U('apL'),'ap',n0)}${line(U('critL'),'critP',x=>f1(x)+'%')}${line('EP (WFB)','ep',f1)}
    </div>
    <p class="model">${U('epNote')}</p>
    <div class="tal"><div class="row"><b>${U('talT')}</b><span>${U('talNote')}</span></div>
      ${[['a','Anticipation','+4 Def/rank (Forever)'],['d','Deflection','+1% parry/rank'],['s','Shield Specialization','+1% block/rank']].map(([k,n,h])=>
        `<label><span>${n}<small>${h}</small></span><select id="tal-${k}" data-tal="${k}">${[0,1,2,3,4,5].map(r=>`<option ${((S.talents||{})[k]??(k==='t'?0:5))===r?'selected':''}>${r}</option>`).join('')}</select></label>`).join('')}
    </div>`;
}
document.addEventListener('pointerover',e=>{ const o=e.target.closest('[data-pv]'); if(!o||S.tab!=='gear') return;
  const [slot,id]=o.dataset.pv.split(':'); if(PREVIEW&&PREVIEW.slot===slot&&PREVIEW.id===+id) return;
  const cur=selected(SLOTS.find(s=>s.k===slot)); PREVIEW=(cur.id===+id)?null:{slot,id:+id}; renderStats(); });
document.addEventListener('pointerout',e=>{ const o=e.target.closest('[data-pv]'); if(!o||o.contains(e.relatedTarget)) return; if(PREVIEW){PREVIEW=null; renderStats();} });

// ---------- RENDER ----------
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
const STL={def:'Def',hit:'Hit',sta:'Sta',str:'Str',agi:'Agi',armor:'Armor',bv:'BV',exp:'Exp',ap:'AP',int:'Int',spi:'Spi',hp5:'HP5',blk:'Block',sp:'SP',crit:'Crit',shp:'Shadow',fip:'Fire',mp5:'MP5',haste:'Haste',pen:'Pen'};
const fmtSt=st=>Object.entries(st).map(([k,v])=>`${['hit','exp','blk','crit'].includes(k)?v+'%':'+'+v} ${STL[k]}`).join(' · ');

function render(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=U(el.dataset.i));
  document.documentElement.dataset.cls=CLS();
  $('specSel').innerHTML=SPECS.map(g=>`<optgroup label="${U('cls_'+g.cls)}">${g.specs.map(sp=>`<option value="${sp}" ${S.spec===sp?'selected':''}>${U('spec_'+sp)}</option>`).join('')}</optgroup>`).join('');
  document.querySelector('h1 small').textContent=IS_WL()?U('subWL')(U('spec_'+S.spec)):U(IS_FURY()?'subF':'sub');
  $('fa').textContent=U('A'); $('fh').textContent=U('H'); $('simlink').textContent=U('sim');
  $('fa').setAttribute('aria-pressed',S.faction==='A'); $('fh').setAttribute('aria-pressed',S.faction==='H');
  $('les').setAttribute('aria-pressed',S.lang==='es'); $('len').setAttribute('aria-pressed',S.lang==='en');
  renderSupport(); $('howPanel').innerHTML=U('how'); $('srcPanel').innerHTML=U(IS_WL()?'srcWL':IS_FURY()?'srcF':'src'); $('io').placeholder=U('ioPh');
  hideTT();

  const t=calc();
  const m=(lbl,val,cap,unit,soft)=>{const pct=Math.min(100,val/cap*100);return `<div class="meter"><div class="lbl">${lbl}<b>${unit==='%'?val.toFixed(1):Math.round(val)}${unit} / ${cap}${unit}</b></div><div class="track"><i class="${val>=cap?'ok':(soft?'soft':'')}" style="width:${pct}%"></i></div></div>`};
  $('meters').innerHTML = IS_WL()? m(U('hit'),t.hit,WLMODEL.hitCap,'%',true)+`<div class="meter"><div class="lbl">${U('spL')}<b>${Math.round(S.spec==='aff'?t.shadow:t.fire)}</b></div></div><div class="meter"><div class="lbl">${U('critWL')}<b>${t.crit.toFixed(1)}%</b></div></div>`
    : IS_FURY()? m(U('hit'),t.hit,FMODEL.hitCap,'%',true)+m(U('expL'),t.exp,FMODEL.expCap,'%',true)+`<div class="meter"><div class="lbl">${U('critTot')}<b>${t.crit.toFixed(1)}% · AP ${Math.round(t.ap)}</b></div></div>`
    : m(U('defGear'),t.D,MODEL.defCap,'')+m(U('hit'),t.hit,MODEL.hitCap,'%',true)+m(U('crushL').split(' (')[0],t.full,MODEL.crushCap,'%');
  simURL().then(u=>$('simlink').href=u);

  const al=[];
  const f1=selected(SLOTS.find(s=>s.k==='finger1')), f2=selected(SLOTS.find(s=>s.k==='finger2'));
  if(!S.offSlot.finger1&&!S.offSlot.finger2&&f1.id===f2.id) al.push(U('dupRing')(itemRef(f1.id)));
  SLOTS.forEach(sl=>{ if(S.offSlot[sl.k]) return; const o=selected(sl); if(o.flag) al.push(`${itemRef(o.id)}: ${esc(tx(o.flag))}.`); });
  if(IS_WL()&&t.hit<WLMODEL.hitCap) al.push(esc(U('hitShortWL')((WLMODEL.hitCap-t.hit).toFixed(1))));
  if(!IS_FURY()&&!IS_WL()&&t.D<MODEL.defCap) al.push(esc(U('defShort')(MODEL.defCap-Math.round(t.D))));
  if(IS_FURY()&&t.hit<FMODEL.hitCap) al.push(esc(U('hitShortF')((FMODEL.hitCap-t.hit).toFixed(1))));
  $('alerts').innerHTML=al.map(a=>`<div class="alert">${a}</div>`).join('');

  const {order,need}=computeRoute();
  const active=order.filter(id=>st(id)!=='skipped'), doneN=active.filter(id=>st(id)==='done').length;
  $('skipCount').textContent=order.filter(id=>st(id)==='skipped').length;
  $('prog').innerHTML=`<span>${doneN} / ${active.length} ${U('steps')}</span><div class="track"><i class="${doneN===active.length&&active.length?'ok':''}" style="width:${active.length?doneN/active.length*100:0}%"></i></div><span>${active.length?Math.round(doneN/active.length*100):0}%</span>`;
  const items=id=>[...need.get(id)].map(itemRef);
  const nx=nextStep(order,need);
  if(nx){ const n=NODE[nx];
    $('next').innerHTML=`<div style="min-width:0"><div class="eyebrow">${U('nextEy')} · ${esc(tx(PHASES[PH_RANK[n.phase]].name))}</div><h2>${linkify(tx(n.title))}</h2><p>${esc(tx(n.where))} — ${U('unlocks')}: ${items(nx).join(', ')}</p></div><div class="acts"><button class="btn primary" data-act="done" data-id="${nx}">${U('complete')}</button><button class="btn" data-act="later" data-id="${nx}">${U('later')}</button><button class="btn" data-act="skip" data-id="${nx}">${U('skip')}</button></div>`;
  } else $('next').innerHTML=`<div><div class="eyebrow">${U('tabRoute')}</div><h2>${active.length?U('routeDone'):U('routeEmpty')}</h2><p>${order.some(id=>st(id)==='later')?U('blockedLater'):(active.length?U('routeDoneP'):U('routeEmptyP'))}</p></div>`;

  let html='';
  const stepHTML_=id=>{ const n=NODE[id], s=st(id);
      const pend=n.deps.filter(d=>need.has(d)&&!resolved(d));
      return `<article class="step ${s} ${id===nx?'isnext':''} ${pend.length&&s==='pending'?'blocked':''}">
        <input type="checkbox" class="chk" id="c-${id}" aria-label="${U('complete')}: ${esc(tx(n.title))}" ${s==='done'?'checked':''} ${s==='skipped'?'disabled':''} data-act="toggle" data-id="${id}">
        <div class="t">${linkify(tx(n.title))}<div class="where">${esc(tx(n.where))}</div></div>
        <div class="sacts">${s==='skipped'||s==='later'?`<button class="link" data-act="restore" data-id="${id}">${s==='later'?U('resume'):U('restore')}</button>`:`${s==='pending'?`<button class="link" data-act="later" data-id="${id}">${U('later')}</button>`:''}<button class="link" data-act="skip" data-id="${id}">${U('skip')}</button>`}</div>
        <div class="d">${linkify(descFor(n))}</div>
        <div class="meta">${items(id).map(x=>`<span class="chip">${x}</span>`).join('')}${pend.length&&s==='pending'?`<span class="chip req">${U('requires')}: ${pend.map(d=>esc(tx(NODE[d].title))).join(' · ')}</span>`:''}${n.verify?`<span class="chip note">${U('verify')}</span>`:''}</div>
      </article>`; };
  PHASES.forEach(p=>{
    const ids=order.filter(id=>NODE[id].phase===p.id && st(id)!=='later' && (S.showSkipped||st(id)!=='skipped') && (S.showDone||st(id)!=='done'));
    if(!ids.length) return;
    const tot=order.filter(id=>NODE[id].phase===p.id&&st(id)!=='skipped'), dn=tot.filter(id=>st(id)==='done').length;
    html+=`<div class="phase"><h3>${esc(tx(p.name))} <span>${dn}/${tot.length}${tx(p.hint)?' · '+esc(tx(p.hint)):''}</span></h3>`;

    ids.forEach(id=>{ html+=stepHTML_(id); });
    html+='</div>';
  });
  $('route').innerHTML=html||`<p style="color:var(--muted)">${U('nothing')}</p>`;
  const lat=order.filter(id=>st(id)==='later');
  $('laterBox').hidden=!lat.length;
  if(lat.length){ $('laterBox').innerHTML=`<details ${S.laterOpen?'open':''} id="laterDet"><summary><span>${U('laterT')}</span><span class="cnt">${lat.length}</span></summary><p class="lh">${U('laterHint')}</p><div class="phase">${lat.map(stepHTML_).join('')}</div></details>`; }

  $('ench').checked=S.ench; $('showDone').checked=S.showDone; $('showSkipped').checked=S.showSkipped;
  // Gear slot, character-sheet style: big quality-framed icon, slot label, item name, set, enchant, source · EP.
  // "⇅ n" opens the options below (each one compact, with its own icon, stats, badges, delta and "I have it").
  const epFor=(o,k)=>(IS_WL()?epWL(o,k):IS_FURY()?epFury(o,k):epOf(o,k));
  const badgeHTML=o=>{ const bs=o.bis||[]; return `${bs.includes('wfb'+S.faction)?`<span class="b wfb">${U('wfbBis')}</span>`:''}${bs.includes('wtbc')?`<span class="b wtbc">${U('wtbcBis')}</span>`:''}${IS_FURY()&&bs.includes('su')?`<span class="b wtbc">sixtyupgrades</span>`:''}${o.verify?`<span class="b warn">${U('verifyB')}</span>`:''}`; };
  const cardHTML=(sl,side)=>{ if(!sl) return ''; if(sl.k==='offhand'&&IS_WL()&&ohBlocked()) return `<section class="gs ${side} off"><div class="gs-row"><span class="gs-ic"><span class="ico big q1" aria-hidden="true"><b>—</b></span></span><div class="gs-b"><div class="gs-slot">${esc(tx(sl.n))}</div><div class="gs-src">${U('ohTwo')}</div></div></div></section>`;
    const cur=selected(sl), off=!!S.offSlot[sl.k], open=!!OPEN[sl.k], all=optsFor(sl), own=!!S.have[cur.id];
    const ench=S.ench&&sl.ench&&!(IS_WL()&&sl.k==='mainhand'&&!cur.two)?`<div class="gs-en"><span class="ico mini q2" aria-hidden="true"><img src="${ICON_URL('trade_engraving','small')}" alt="" loading="lazy" onerror="this.remove()"></span>${esc(sl.ench.n.replace(/^(Enchant [A-Za-z]+ - |Lesser Arcanum of |Arcanum of )/,m=>m.startsWith('Enchant')?'':m))}</div>`:'';
    const opts=open?`<div class="gs-opts" role="radiogroup" aria-label="${esc(tx(sl.n))}">${all.map(o=>{ const rid=`o-${sl.k}-${o.id}`;
        return `<div class="gopt ${o.id===cur.id?'sel':''} ${S.have[o.id]?'owned':''}" data-pv="${sl.k}:${o.id}">
          <input class="sr" type="radio" name="s-${sl.k}" id="${rid}" value="${o.id}" data-slot="${sl.k}" ${o.id===cur.id?'checked':''}>
          <label for="${rid}" class="gopt-ic">${ico(o.id,'big')}</label>
          <div class="gopt-b"><label for="${rid}" class="gopt-n q${o.q}" data-item="${o.id}">${esc(o.n)}</label>
            <div class="gopt-st">${fmtSt(o.st)} · <b>EP ${epFor(o,sl.k).toFixed(1)}</b></div>
            <div class="gopt-src">${esc(tx(o.src))}</div>
            <div class="gopt-meta"><span class="badges">${badgeHTML(o)}</span><span class="delta">${deltaChips(sl,o,cur)}</span></div>
            <div class="gopt-act"><label class="own"><input type="checkbox" id="h-${sl.k}-${o.id}" data-have="${o.id}" ${S.have[o.id]?'checked':''}> ${U('have')}</label><a class="wh" href="${WH(o.id)}" target="_blank" rel="noopener">Wowhead ↗</a></div>
          </div></div>`; }).join('')}
        <label class="gs-ignore"><input type="checkbox" id="x-${sl.k}" data-off="${sl.k}" ${off?'checked':''}> ${U('ignore')}</label></div>`:'';
    return `<section class="gs ${side} ${off?'off':''} ${open?'open':''}">
      <div class="gs-row" data-pv="${sl.k}:${cur.id}">
        <span class="gs-ic" data-item="${cur.id}" tabindex="0">${ico(cur.id,'big')}${own?'<span class="gs-own" title="✓">✓</span>':''}</span>
        <div class="gs-b">
          <div class="gs-slot">${esc(tx(sl.n))}${off?` · <span class="gs-off">${U('ignore')}</span>`:''}</div>
          <div class="gs-n q${cur.q}" data-item="${cur.id}" tabindex="0">${esc(cur.n)}</div>
          ${cur.set?`<span class="gs-set">${esc(cur.set)}</span>`:''}
          ${ench}
          <div class="gs-src">${esc(tx(cur.src))} · ${epFor(cur,sl.k).toFixed(1)} EP</div>
          <div class="gs-badges">${badgeHTML(cur)}</div>
        </div>
        <button class="gs-sw" data-open="${sl.k}" aria-expanded="${open}" title="${open?U('hide'):U('change')}">${open?'✕':'⇅ '+all.length}</button>
      </div>${opts}</section>`; };
  const L=['head','neck','shoulder','back','chest','wrist','mainhand','offhand','ranged'], R=['hands','waist','legs','feet','finger1','finger2','trinket1','trinket2'];
  const bySlot=k=>SLOTS.find(s=>s.k===k);
  $('colL').innerHTML=L.map(k=>cardHTML(bySlot(k),'l')).join('');
  $('colR').innerHTML=R.map(k=>cardHTML(bySlot(k),'r')).join('');
  renderStats();
  renderPresets();

  ['route','gear','data'].forEach(v=>{ $('v-'+v).hidden=S.tab!==v; $('tab-'+v).setAttribute('aria-selected',S.tab===v); });
  save();
}

// ---------- EVENTS ----------
document.addEventListener('change',e=>{ if(e.target.id==='specSel'&&e.target.value!==S.spec){ S.spec=e.target.value; applySpec(); S.lastPre=''; PREVIEW=null; for(const k in OPEN) delete OPEN[k]; render(); } });
document.addEventListener('click',e=>{
  const ref=e.target.closest('[data-item]');
  if(ref){ // touch/tap: toggle tooltip; on a radio label the tap still selects the option
    const id=+ref.dataset.item;
    if(!tt.hidden&&ttFor===id&&!ref.closest('label')) hideTT(); else { showTT(ref,e.clientX,e.clientY); }
  } else if(!e.target.closest('#tt')) hideTT();
  const b=e.target.closest('[data-act]'); if(b&&b.tagName==='BUTTON'){ const id=b.dataset.id;
    if(b.dataset.act==='done'){S.steps[id]='done';toast(U('tDone'))}
    if(b.dataset.act==='skip'){S.steps[id]='skipped';toast(U('tSkip'))}
    if(b.dataset.act==='later'){S.steps[id]='later';toast(U('tLater'))}
    if(b.dataset.act==='restore'){delete S.steps[id];toast(U('tRestore'))}
    render(); }
  const f=e.target.closest('[data-f]'); if(f){S.faction=f.dataset.f;render()}
  const sp=e.target.closest('[data-sp]'); if(sp&&sp.dataset.sp!==S.spec){S.spec=sp.dataset.sp; applySpec(); S.lastPre=''; PREVIEW=null; for(const k in OPEN) delete OPEN[k]; render()}
  const l=e.target.closest('[data-l]'); if(l){S.lang=l.dataset.l;render()}
  const tb=e.target.closest('[role=tab]'); if(tb){S.tab=tb.dataset.v;render()}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideTT(); });
document.addEventListener('toggle',e=>{ if(e.target.id==='laterDet'){ S.laterOpen=e.target.open; save(); } },true);
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='preSel'){ applyPreset(el.value); return; }
  if(el.dataset.act==='toggle'){ if(el.checked) S.steps[el.dataset.id]='done'; else delete S.steps[el.dataset.id]; }
  else if(el.dataset.slot){ SEL()[el.dataset.slot]=+el.value; delete S.offSlot[el.dataset.slot]; S.lastPre=''; delete OPEN[el.dataset.slot]; PREVIEW=null; }
  else if(el.dataset.have){ if(el.checked) S.have[el.dataset.have]=true; else delete S.have[el.dataset.have]; }
  else if(el.dataset.off){ if(el.checked) S.offSlot[el.dataset.off]=true; else delete S.offSlot[el.dataset.off]; }
  else if(el.dataset.tal){ S.talents=Object.assign({a:5,d:5,s:5,t:0,c:5,sup:5,dev:5},S.talents||{}); S.talents[el.dataset.tal]=+el.value; S.talSrc=Object.assign({},S.talSrc,{[el.dataset.tal]:'manual'}); }
  else if(el.id==='ench') S.ench=el.checked;
  else if(el.id==='showDone') S.showDone=el.checked;
  else if(el.id==='showSkipped') S.showSkipped=el.checked;
  else return;
  render();
});

let PFORM=false;
function renderPresets(){
  const mine=S.presets.map((p,i)=>({p,i})).filter(x=>x.p.faction===S.faction&&(x.p.spec||'prot')===S.spec);
  const mineOk=p=>p&&p.faction===S.faction&&(p.spec||'prot')===S.spec;
  let cur=S.lastPre||''; if(cur&&!['wfb','wtbc','su','hit','tank','nocraft','nr','fr','bal','opt'].includes(cur)&&!mineOk(S.presets[+cur])) cur='';
  const o=(v,l,t)=>`<option value="${v}" ${cur===v?'selected':''} ${t?`title="${esc(t)}"`:''}>${esc(l)}</option>`;
  const curMine=/^\d+$/.test(cur)&&mineOk(S.presets[+cur]);
  $('presetBar').innerHTML=`<select id="preSel" class="presel" aria-label="${U('presetL')}">
      <option value="" ${cur?'':'selected'} disabled>${U('presetPick')}</option>

      ${IS_FURY()||IS_WL()?'':`<optgroup label="${U('pgRes')}">${o('nr',U('resNR'),U('resTip'))}${o('fr',U('resFR'),U('resTip'))}</optgroup>`}
      ${mine.length?`<optgroup label="${U('pgMine')}">${mine.map(({p,i})=>o(String(i),p.name)).join('')}</optgroup>`:''}
    </select>`+
    (curMine?`<button class="btn" data-pdel="${cur}" aria-label="${U('delPreset')}: ${esc(S.presets[+cur].name)}">× ${U('delPreset')}</button>`:'')+
    (PFORM?`<span class="pform"><input id="pname" maxlength="32" placeholder="${U('presetName')}" aria-label="${U('presetName')}"><button class="btn primary" data-pok>${U('save')}</button><button class="btn" data-pcancel>${U('cancel')}</button></span>`
          :`<button class="btn" data-psave>${U('savePreset')}</button>`);
}
function applyPreset(k){
  if(k==='wfb'){preset('wfb'+S.faction);toast(U('tPresetW'))} else if(k==='wtbc'){preset('wtbc');toast(U('tPresetT'))} else if(k==='su'){preset('su');toast(U('tPresetSU'))}
  else if(IS_WL()&&(k==='opt'||k==='nocraft')){ const b=runOptWL('ep',k==='nocraft'); Object.assign(SEL(),b.pick); if(!b.pick.offhand){} const c=calc(); toast(U('tWL')(c.hit.toFixed(1),Math.round(S.spec==='aff'?c.shadow:c.fire),c.crit.toFixed(1),Math.round(c.ep))); }
  else if(k==='hit'||k==='tank'||k==='nocraft'){ const b=optimizeHit(false,k==='tank'?'tank':'ep',k==='nocraft'); Object.assign(SEL(),b.pick);
    const c=calc(); toast(IS_FURY()?U('tFury')(b.hit.toFixed(1),c.crit.toFixed(1),Math.round(c.ep)):U(k==='tank'?'tTank':k==='nocraft'?'tNoCraft':'tMaxHit')(b.hit.toFixed(1),Math.round(c.D))); }
  else if(k==='bal'&&!IS_FURY()){ Object.assign(SEL(),RES_SETS.bal); const c=calc(); toast(U('tBal')(Math.round(c.D),c.hit.toFixed(1),Math.round(c.ep))); }
  else if(RES_SETS[k]&&!IS_FURY()){ Object.assign(SEL(),RES_SETS[k]); const c=calc(); toast(U('tRes')(k==='nr'?U('natL'):U('fireL'),Math.round(k==='nr'?c.nr:c.fr),c.hit.toFixed(1),Math.round(c.D))); }
  else { const p=S.presets[+k]; if(p){ Object.assign(SEL(),p.sel); toast(U('tPresetApplied')(p.name)); } }
  S.lastPre=k; render();
}
document.addEventListener('click',e=>{
  const pd=e.target.closest('[data-pdel]');
  if(pd){ const p=S.presets[+pd.dataset.pdel]; if(p){ S.presets.splice(+pd.dataset.pdel,1); S.lastPre=''; toast(U('tPresetDel')(p.name)); render(); } return; }
  if(e.target.closest('[data-psave]')){ PFORM=true; renderPresets(); const i=$('pname'); if(i) i.focus(); return; }
  if(e.target.closest('[data-pcancel]')){ PFORM=false; renderPresets(); return; }
  if(e.target.closest('[data-pok]')){ savePresetNow(); return; }
  const go=e.target.closest('.gopt'); if(go&&!e.target.closest('a,input,label')){ const r=go.querySelector('input[type=radio]'); if(r&&!r.checked){ r.checked=true; r.dispatchEvent(new Event('change',{bubbles:true})); } return; }
  const ob=e.target.closest('[data-open]'); if(ob){ const k=ob.dataset.open; if(OPEN[k]) delete OPEN[k]; else OPEN[k]=true; PREVIEW=null; render(); }
});
document.addEventListener('keydown',e=>{ if(e.target.id==='pname'){ if(e.key==='Enter') savePresetNow(); if(e.key==='Escape'){PFORM=false;renderPresets();} } });
function savePresetNow(){
  const name=($('pname').value||'').trim() || `Preset ${S.presets.length+1}`;
  const sel={}; SLOTS.forEach(sl=>sel[sl.k]=selected(sl).id);
  S.presets.push({name,faction:S.faction,spec:S.spec,sel}); PFORM=false; render(); toast(U('tPresetSaved')(name));
}
$('exp').onclick=async()=>{ const txt=JSON.stringify(S); $('io').value=txt;
  try{await navigator.clipboard.writeText(txt);toast(U('tCopied'))}catch(err){$('io').select();toast(U('tCopyFail'))} };
$('imp').onclick=()=>{ try{ S=Object.assign(DEF(),JSON.parse($('io').value)); render(); toast(U('tImp')); }catch(err){ toast(U('tImpFail')); } };
// game bridge: PR1;f=A;s=head:226869,...;h=id,id;d=step,step;k=step,step;x=slot,slot
function toGame(){
  const sel=SLOTS.filter(sl=>!(sl.k==='offhand'&&IS_WL()&&ohBlocked())).map(sl=>`${sl.k}:${selected(sl).id}`).join(',');
  const ids=Object.keys(S.steps);
  return ['PR1','p='+S.spec,'f='+S.faction,'s='+sel,'h='+Object.keys(S.have).join(','),'d='+ids.filter(i=>S.steps[i]==='done').join(','),'k='+ids.filter(i=>S.steps[i]==='skipped').join(','),'l='+ids.filter(i=>S.steps[i]==='later').join(','),'x='+Object.keys(S.offSlot).join(',')].join(';');
}
function fromGame(str){
  str=(str||'').trim(); if(!str.startsWith('PR1;')) throw new Error('bad');
  const p={}; str.split(';').slice(1).forEach(kv=>{const i=kv.indexOf('='); if(i>0) p[kv.slice(0,i)]=kv.slice(i+1);});
  const list=v=>(v||'').split(',').filter(Boolean);
  if(p.f==='A'||p.f==='H') S.faction=p.f;
  if(SPEC_SLOTS[p.p]){ S.spec=p.p; applySpec(); }
  list(p.s).forEach(e=>{const [k,id]=e.split(':'); if(SLOTS.some(s=>s.k===k)) SEL()[k]=+id;});
  S.have={}; list(p.h).forEach(id=>S.have[id]=true);
  S.steps={}; list(p.d).forEach(id=>{if(NODE[id]) S.steps[id]='done'}); list(p.k).forEach(id=>{if(NODE[id]) S.steps[id]='skipped'}); list(p.l).forEach(id=>{if(NODE[id]) S.steps[id]='later'});
  if(p.t){ const t={}; list(p.t).forEach(x=>{ const m=x.match(/^(supD|sup|dev|[adstc])(\d)$/); if(m) t[m[1]]=+m[2]; }); S.talents=Object.assign({a:5,d:5,s:5,t:0,c:5,sup:5,dev:5},t);
    S.talSrc={}; Object.keys(t).forEach(k=>S.talSrc[k]='addon'); }
  S.offSlot={}; list(p.x).forEach(k=>S.offSlot[k]=true);
  return list(p.d).length;
}
$('gimp').onclick=()=>{ try{ const n=fromGame($('gio').value); render(); toast(U('tGimp')(n)); }catch(err){ toast(U('tGimpFail')); } };
$('gexp').onclick=async()=>{ const t=toGame(); $('gio').value=t; try{await navigator.clipboard.writeText(t);toast(U('tCopied'))}catch(err){$('gio').select();toast(U('tCopyFail'))} };
$('reset').onclick=()=>{$('resetConfirm').hidden=false};
$('resetYes').onclick=()=>{const lang=S.lang;S=DEF();S.lang=lang;$('resetConfirm').hidden=true;render();toast(U('tReset'))};
render();
</script>
